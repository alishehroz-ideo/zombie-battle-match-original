<link rel="stylesheet" href="result-ui.css"><link rel="stylesheet" href="hud-ui.css"></head><body><div id="orientation-note">縦向きでのプレイがおすすめです</div><div id="frame"><button id="page-mute" type="button" aria-pressed="false">音声 ON</button><canvas id="unity-canvas" width="540" height="960" tabindex="-1"></canvas><div id="title-shine" aria-hidden="true"></div><button id="mission-start" hidden>▶ START</button><div id="gate"><h1>ZOMBIE<br>BATTLE MATCH</h1><p id="status"></p><button id="play">▶ START</button><progress id="progress" max="1" value="0" hidden></progress><p id="error" role="alert"></p></div></div><button id="fullscreen" hidden>全画面</button><button id="replay-log" hidden style="position:fixed;left:10px;bottom:10px;padding:7px 10px;font-size:12px">試合ログ保存</button><script src="webgl-data.js"></script><script>
window.onZombieMatchStarted = function(){document.getElementById('frame').classList.add('match-running');window.dispatchEvent(new Event("zombie-match-started"));};
window.onZombieMatchReplay = function(json){document.body.dataset.matchReplay=json;window.dispatchEvent(new CustomEvent("zombie-match-replay",{detail:JSON.parse(json)}));};
window.onZombieScoreMatchFinished = function(json) { document.getElementById('frame').classList.remove('match-running');const result = JSON.parse(json); document.body.dataset.matchResult = json;document.getElementById("replay-log").hidden=false; window.dispatchEvent(new CustomEvent("zombie-score-match-finished", {detail:result})); };
const canvas=document.getElementById('unity-canvas'),gate=document.getElementById('gate'),progress=document.getElementById('progress'),button=document.getElementById('play');let instance;

window.returnToZombieTitle=()=>{if(!instance)throw new Error('Game unavailable');instance.SendMessage('ZombieAudioControl','ReturnToTitle','');document.getElementById('title-shine').hidden=false;};
const muteButton=document.getElementById('page-mute');let pageMuted=false;
try{pageMuted=localStorage.getItem('zombie-muted')==='1';}catch(e){}
function applyPageMute(){muteButton.textContent=pageMuted?'🔇':'🔊';muteButton.setAttribute('aria-pressed',String(pageMuted));muteButton.setAttribute('aria-label',pageMuted?'音声をオンにする':'ミュートする');if(instance)instance.SendMessage('ZombieAudioControl','SetMuted',pageMuted?'1':'0');}
muteButton.onclick=()=>{pageMuted=!pageMuted;try{localStorage.setItem('zombie-muted',pageMuted?'1':'0');}catch(e){}applyPageMute();};
applyPageMute();

button.onclick=()=>{button.disabled=true;button.hidden=true;progress.hidden=false;document.getElementById('status').textContent='ゲームを読み込み中… 初回は時間がかかります';const script=document.createElement('script');script.src='Build/webgl-build.loader.js';script.onload=()=>createUnityInstance(canvas,{dataUrl:'Build/webgl-build.data.unityweb',frameworkUrl:'Build/webgl-build.framework.js.unityweb',codeUrl:'Build/webgl-build.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:'Brave Giant Entertainment',productName:'Zombie Puzzle Survival',productVersion:'0.1.5'},value=>{progress.value=value}).then(game=>{instance=game;applyPageMute();if(window.BattleResultUI&&window.onZombieHud)instance.SendMessage('ZombieAudioControl','EnableWebUI','1');instance.SendMessage('ZombieAudioControl','StartMatch','');gate.hidden=true;gate.style.display='none';document.getElementById('fullscreen').hidden=false;canvas.focus()}).catch(error=>{document.getElementById('error').textContent='起動できませんでした。'+String(error);document.getElementById('status').textContent='再読み込みしてお試しください'});script.onerror=()=>{document.getElementById('error').textContent='読み込みに失敗しました。接続を確認して再読み込みしてください'};document.body.append(script)};
document.getElementById('replay-log').onclick=()=>{const data={result:JSON.parse(document.body.dataset.matchResult),replay:JSON.parse(document.body.dataset.matchReplay||'{}')};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='zombie-match-log.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
document.getElementById('fullscreen').onclick=()=>{if(instance)instance.SetFullscreen(1)};
</script><script>
(()=>{const shine=document.getElementById('title-shine');let atResult=false;
window.addEventListener('zombie-match-started',()=>{shine.hidden=true;atResult=false;});
window.addEventListener('zombie-score-match-finished',()=>{shine.hidden=true;atResult=true;});
const resultCanvas=document.getElementById('unity-canvas');let resultButtonDown=false;
const onResultButton=e=>{const r=resultCanvas.getBoundingClientRect(),w=r.width/r.height*960,fit=Math.min((w-20)/335,920/408),left=(w-335*fit)/2,top=(960-408*fit)/2,x=((e.clientX-r.left)/r.width*w-left)/fit,y=((e.clientY-r.top)/r.height*960-top)/fit;return x>=36&&x<=299&&y>=335&&y<=382;};
resultCanvas.addEventListener('pointerdown',e=>{resultButtonDown=atResult&&onResultButton(e);},true);
resultCanvas.addEventListener('pointerup',e=>{const retry=atResult&&resultButtonDown&&onResultButton(e);resultButtonDown=false;if(retry){atResult=false;requestAnimationFrame(()=>{shine.hidden=false;});}},true);
})();
</script><script>
// Page sound cues follow the same mute state as Unity.
let cueAudio;
const zombieStartVoice=new Audio("start-zombie.wav");zombieStartVoice.preload="auto";zombieStartVoice.volume=.8;zombieStartVoice.playbackRate=.9;
function combatCue(kind){if(pageMuted)return;if(kind==='start'){zombieStartVoice.currentTime=0;zombieStartVoice.play().catch(()=>{});return;}try{
 cueAudio=cueAudio||new(window.AudioContext||window.webkitAudioContext)();cueAudio.resume();const t=cueAudio.currentTime;
 const tone=(f,at,d,v,type='sine')=>{const o=cueAudio.createOscillator(),g=cueAudio.createGain();o.type=type;o.frequency.setValueAtTime(f,t+at);g.gain.setValueAtTime(.001,t+at);g.gain.exponentialRampToValueAtTime(v,t+at+.012);g.gain.exponentialRampToValueAtTime(.001,t+at+d);o.connect(g).connect(cueAudio.destination);o.start(t+at);o.stop(t+at+d+.02);};
 const hit=(at,d,v)=>{const b=cueAudio.createBuffer(1,Math.ceil(cueAudio.sampleRate*d),cueAudio.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*Math.exp(-i/(cueAudio.sampleRate*d*.17));const s=cueAudio.createBufferSource(),g=cueAudio.createGain(),f=cueAudio.createBiquadFilter();s.buffer=b;f.type='lowpass';f.frequency.value=kind==='start'?3000:1400;g.gain.value=v;s.connect(f).connect(g).connect(cueAudio.destination);s.start(t+at);};
 {hit(0,.25,.18);[392,494,587,784].forEach((f,i)=>{tone(f,i*.12,.36,.075,'triangle');tone(f/2,i*.12,.4,.045);});tone(1046,.49,.5,.045,'triangle');}
 }catch(e){} }
const replayStart=document.getElementById('mission-start');
document.getElementById('play').addEventListener('click',()=>combatCue('start'));
replayStart.onclick=()=>{combatCue('start');instance.SendMessage('ZombieAudioControl','StartMatch','');replayStart.hidden=true;};
window.addEventListener('zombie-match-started',()=>{replayStart.hidden=true;});
window.addEventListener('zombie-score-match-finished',()=>{replayStart.hidden=true;combatCue('result');});
document.getElementById('page-mute').addEventListener('click',()=>{if(pageMuted){zombieStartVoice.pause();zombieStartVoice.currentTime=0;}if(cueAudio){if(pageMuted)cueAudio.suspend();else cueAudio.resume();}});
const titleObserver=new MutationObserver(()=>{replayStart.hidden=document.getElementById('title-shine').hidden||!gate.hidden;});
titleObserver.observe(document.getElementById('title-shine'),{attributes:true,attributeFilter:['hidden']});
</script><script src="result-ui.js"></script><script src="hud-ui.js"></script></body></html>
